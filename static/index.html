<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABOT Monitoring Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
        <i class="fa-solid fa-chart-line text-emerald-400 text-2xl"></i>
        <span class="text-xl font-bold tracking-wider text-white">SABOT <span
                class="text-emerald-400">LOGS</span></span>
    </div>
    <div class="flex items-center space-x-4">
            <span id="health-status"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-red-900/50 text-red-400 border border-red-700">
                <i class="fa-solid fa-circle-dot animate-pulse mr-1"></i> Checking System
            </span>
        <button onclick="loadDashboardData()"
                class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition-all">
            <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh
        </button>
    </div>
</nav>

<div class="p-6 max-w-7xl mx-auto space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-400 uppercase font-semibold">Total Pertanyaan</p>
                <h3 id="stat-total" class="text-3xl font-bold mt-1 text-white">-</h3>
            </div>
            <div class="p-4 bg-emerald-500/10 rounded-lg text-emerald-400"><i class="fa-solid fa-comments text-2xl"></i>
            </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-400 uppercase font-semibold">Kueri Hari Ini</p>
                <h3 id="stat-today" class="text-3xl font-bold mt-1 text-white">-</h3>
            </div>
            <div class="p-4 bg-blue-500/10 rounded-lg text-blue-400"><i class="fa-solid fa-calendar-day text-2xl"></i>
            </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <p class="text-sm text-gray-400 uppercase font-semibold mb-2">Lesson Teraktif</p>
            <div id="stat-top-lessons" class="space-y-1 text-xs text-gray-300">-</div>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <p class="text-sm text-gray-400 uppercase font-semibold mb-2">Top Pertanyaan Berulang</p>
            <div id="stat-top-questions" class="space-y-1 text-xs text-emerald-300 truncate max-w-xs">-</div>
        </div>
    </div>

    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
        <div class="p-5 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-list-ul mr-2 text-emerald-400"></i>Pipa
                Riwayat Chatbot (Live Logs)</h2>
            <div class="flex items-center space-x-2">
                <input type="text" id="filter-lesson" placeholder="Cari Lesson ID (e.g. 2026-q2-w01-d1)"
                       class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-emerald-500 text-white w-64">
                <button onclick="loadLogs()"
                        class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-900 transition-all">
                    Filter
                </button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-gray-900/50 text-gray-400 text-xs uppercase border-b border-gray-700">
                    <th class="p-4 w-12">ID</th>
                    <th class="p-4 w-36">Timestamp</th>
                    <th class="p-4 w-32">Lesson ID</th>
                    <th class="p-4">Pertanyaan Jemaat</th>
                    <th class="p-4">Sintesis Jawaban Chatbot</th>
                </tr>
                </thead>
                <tbody id="logs-tbody" class="divide-y divide-gray-700/50 text-sm">
                <tr>
                    <td colspan="5" class="p-8 text-center text-gray-500"><i
                            class="fa-solid fa-spinner animate-spin mr-2"></i>Memuat riwayat transaksi log...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BASE_URL = "https://api.developedbytoo.me";

    async function checkHealth() {
        try {
            const r = await fetch(`${BASE_URL}/health`);
            const d = await r.json();
            const el = document.getElementById('health-status');
            if (d.status === 'ok' && d.rag_ready) {
                el.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-700";
                el.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> RAG ENGINE READY`;
            } else {
                el.className = "px-3 py-1 rounded-full text-xs font-semibold bg-amber-950 text-amber-400 border border-amber-700";
                el.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> RAG UNINITIALIZED`;
            }
        } catch (e) {
            document.getElementById('health-status').className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-700";
            document.getElementById('health-status').innerHTML = `<i class="fa-solid fa-heart-crack mr-1"></i> DISCONNECTED`;
        }
    }

    async function loadStats() {
        try {
            const r = await fetch(`${BASE_URL}/dashboard/stats`);
            const d = await r.json();
            document.getElementById('stat-total').innerText = d.total_chats;
            document.getElementById('stat-today').innerText = d.today_chats;

            const lesEl = document.getElementById('stat-top-lessons');
            lesEl.innerHTML = d.top_lessons.length ? d.top_lessons.map(l =>
                `<div class="flex justify-between border-b border-gray-700/40 py-0.5"><span class="font-mono text-gray-300">${l.lesson_id}</span><span class="font-bold text-emerald-400">${l.count}×</span></div>`
            ).join('') : '<span class="text-gray-500">Belum ada data</span>';

            const qEl = document.getElementById('stat-top-questions');
            qEl.innerHTML = d.top_questions.length ? d.top_questions.slice(0, 3).map(q =>
                `<div class="truncate border-b border-gray-700/40 py-0.5 text-gray-300" title="${q.question}">${q.count}× — ${q.question}</div>`
            ).join('') : '<span class="text-gray-500">Belum ada data</span>';
        } catch (e) {
            console.error("Gagal memuat statistik:", e);
        }
    }

    async function loadLogs() {
        const tbody = document.getElementById('logs-tbody');
        const lessonId = document.getElementById('filter-lesson').value.strip ? document.getElementById('filter-lesson').value.strip() : document.getElementById('filter-lesson').value;

        let url = `${BASE_URL}/dashboard/logs?limit=50`;
        if (lessonId) url += `&lesson_id=${encodeURIComponent(lessonId)}`;

        try {
            const r = await fetch(url);
            const res = await r.json();

            if (!res.data || res.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500"><i class="fa-solid fa-folder-open mr-2"></i>Tidak ada transaksi riwayat chat log ditemukan</td></tr>`;
                return;
            }

            tbody.innerHTML = res.data.map(row => `
                    <tr class="hover:bg-gray-700/30 transition-all">
                        <td class="p-4 text-gray-400 font-mono text-xs">${row.id}</td>
                        <td class="p-4 text-gray-400 text-xs whitespace-nowrap">${row.created_at}</td>
                        <td class="p-4"><span class="px-2 py-0.5 bg-gray-900 border border-gray-700 rounded text-xs font-mono text-emerald-400">${row.lesson_id || 'GLOBAL/MIX'}</span></td>
                        <td class="p-4 text-gray-200 font-medium max-w-xs md:max-w-md">${row.question}</td>
                        <td class="p-4 text-gray-300 max-w-md bg-gray-900/20"><div class="max-h-24 overflow-y-auto whitespace-pre-wrap pr-2 text-xs leading-relaxed">${row.answer || '<span class="text-red-400 italic">[No Response]</span>'}</div></td>
                    </tr>
                `).join('');
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Gagal memanggil data endpoint log</td></tr>`;
        }
    }

    function loadDashboardData() {
        checkHealth();
        loadStats();
        loadLogs();
    }

    document.addEventListener("DOMContentLoaded", loadDashboardData);
</script>
</body>
</html>
