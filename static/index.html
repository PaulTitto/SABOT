<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekolah Sabat — Asisten Pintar</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F8F5EF; --surface: #FFFFFF; --ink: #1C1A14;
            --ink-muted: #6B6555; --ink-faint: #C8C2B0; --gold: #B8961E;
            --border: rgba(28,26,20,0.1); --user-bg: #1C1A14; --user-text: #F8F5EF;
            --bot-bg: #FFFFFF; --bot-border: rgba(28,26,20,0.08);
            --radius: 16px; --radius-sm: 10px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141210; --surface: #1E1C16; --ink: #F0EDE4;
                --ink-muted: #9B9484; --ink-faint: #454035;
                --user-bg: #F0EDE4; --user-text: #1C1A14;
                --bot-bg: #1E1C16; --bot-border: rgba(240,237,228,0.06);
            }
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid var(--border); background: var(--surface); flex-shrink: 0; }
        .logo-mark { width: 36px; height: 36px; background: var(--ink); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .logo-mark svg { width: 18px; height: 18px; fill: var(--bg); }
        .header-title { font-family: 'DM Serif Display', serif; font-size: 18px; line-height: 1.2; }
        .header-sub { font-size: 12px; color: var(--ink-muted); }
        .status-pill { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); background: var(--bg); border: 0.5px solid var(--border); border-radius: 20px; padding: 5px 12px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4d4d; transition: background 0.4s; }
        .status-dot.ready { background: #4CAF50; }

        #chat { flex: 1; overflow-y: auto; padding: 24px 0; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message-wrap { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 24px; max-width: 850px; width: 100%; margin: 0 auto; }
        .message-wrap.user { align-items: flex-end; }
        .bubble { max-width: 85%; padding: 12px 18px; border-radius: var(--radius); font-size: 15px; line-height: 1.6; }
        .bubble.user { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
        .bubble.bot { background: var(--bot-bg); color: var(--ink); border: 0.5px solid var(--bot-border); border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }

        /* Markdown Styling inside bubble */
        .bubble.bot p { margin-bottom: 8px; }
        .bubble.bot ul, .bubble.bot ol { margin-left: 20px; margin-bottom: 8px; }

        .bubble.streaming::after { content: '●'; animation: pulse 1s infinite; color: var(--gold); margin-left: 4px; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        .meta { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .suggestion { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .suggestion:hover { border-color: var(--gold); background: var(--bg); }

        .input-area { padding: 16px 24px 24px; background: var(--bg); border-top: 0.5px solid var(--border); }
        .input-row { display: flex; gap: 10px; align-items: flex-end; max-width: 800px; margin: 0 auto; background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 10px 12px; }
        #question { flex: 1; background: transparent; border: none; outline: none; font-family: inherit; font-size: 15px; resize: none; max-height: 150px; min-height: 24px; }
        #sendBtn { width: 38px; height: 38px; background: var(--ink); border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #sendBtn:disabled { opacity: 0.3; }
        #sendBtn svg { width: 18px; height: 18px; fill: var(--bg); }
    </style>
</head>
<body>

<header>
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7L12 2zm0 2.24L19 8.5l-7 3.88L5 8.5l7-4.26z"/></svg></div>
    <div><div class="header-title">Sekolah Sabat</div><div class="header-sub">SABOT: Sekolah Sabat AI Bot Optimized Technology.</div></div>
    <div class="status-pill"><div class="status-dot" id="statusDot"></div><span id="statusText">Menghubungkan...</span></div>
</header>

<div id="chat">
    <div class="welcome" id="welcome">
        <h1 style="font-family: 'DM Serif Display'; font-size: 28px;">Halo, Paulus!</h1>
        <p style="color: var(--ink-muted); margin-top: 8px;">Ada yang ingin digali dari pelajaran hari ini?</p>
        <div class="suggestions">
            <button class="suggestion" onclick="ask('Apa tema utama triwulan ini?')">Tema Triwulan</button>
            <button class="suggestion" onclick="ask('Rangkumkan pelajaran hari ini')">Pelajaran Hari Ini</button>
            <button class="suggestion" onclick="ask('Apa ayat hafalan minggu ini?')">Ayat Hafalan</button>
        </div>
    </div>
</div>

<div class="input-area">
    <div class="input-row">
        <textarea id="question" placeholder="Tanyakan sesuatu..." rows="1"></textarea>
        <button id="sendBtn" onclick="sendQuestion()" disabled>
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    const API = 'http://localhost:8000';
    let isStreaming = false;

    async function checkHealth() {

    try {
        const r = await fetch(API + '/health');
        const d = await r.json();

        if (d.rag_ready) {
            document.getElementById('statusDot').classList.add('ready');
            document.getElementById('statusText').textContent = 'Sistem Siap';
            document.getElementById('sendBtn').disabled = false;
        } else {
            document.getElementById('statusText').textContent = 'Inisialisasi RAG...';
        }
    } catch (e) {
        console.error("Health check failed:", e);
        document.getElementById('statusText').textContent = 'Server Offline';
        setTimeout(checkHealth, 3000);
    }
}

    function ask(text) {
        document.getElementById('question').value = text;
        sendQuestion();
    }

    function addMessage(role, text, isBot = false) {
        document.getElementById('welcome')?.remove();
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `message-wrap ${role}`;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${role} ${isBot ? 'streaming' : ''}`;

        if (role === 'user') {
            bubble.textContent = text;
        }

        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    async function sendQuestion() {
        if (isStreaming) return;
        const input = document.getElementById('question');
        const q = input.value.trim();
        if (!q) return;

        input.value = '';
        input.style.height = 'auto';
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;

        addMessage('user', q);
        const botBubble = addMessage('bot', '', true);

        try {
            const resp = await fetch(API + '/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q }),
            });

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                fullText += decoder.decode(value, { stream: true });
                // Gunakan marked untuk render markdown secara real-time
                botBubble.innerHTML = marked.parse(fullText);
                document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            }
        } catch (e) {
            botBubble.textContent = "Maaf, terjadi gangguan koneksi ke server.";
        } finally {
            isStreaming = false;
            botBubble.classList.remove('streaming');
            document.getElementById('sendBtn').disabled = false;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + " • RAG Hybrid";
            botBubble.parentNode.appendChild(meta);
        }
    }

    document.getElementById('question').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    document.getElementById('question').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuestion();
        }
    });

    checkHealth();
</script>
</body>
</html>
